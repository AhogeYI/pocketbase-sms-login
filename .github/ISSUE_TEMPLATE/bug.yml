name: Bug report
description: Behaviour deviates from the docs or expectations
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened vs. what you expected
      description: Include a minimal reproduction (serve command, request/response, log excerpt).
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: This extension's version (tag or go.mod) + PocketBase version
    validations:
      required: true
